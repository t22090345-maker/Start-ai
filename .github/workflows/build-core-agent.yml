name: Build Simple Accessibility Agent APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Create Native Android Project Structure
        run: |
          mkdir -p AI_Assistant/app/src/main/java/com/akash/coreagent
          mkdir -p AI_Assistant/app/src/main/res/values
          mkdir -p AI_Assistant/app/src/main/res/layout
          mkdir -p AI_Assistant/app/src/main/res/xml

          # 1. local.properties & gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > AI_Assistant/local.properties
          
          cat << 'EOF' > AI_Assistant/gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          # 2. settings.gradle
          cat << 'EOF' > AI_Assistant/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CoreAgent"
          include ':app'
          EOF

          # 3. Project build.gradle
          cat << 'EOF' > AI_Assistant/build.gradle
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          # 4. App build.gradle
          cat << 'EOF' > AI_Assistant/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.akash.coreagent'
              compileSdk 34

              defaultConfig {
                  applicationId "com.akash.coreagent"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # 5. res/values/strings.xml
          cat << 'EOF' > AI_Assistant/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Core Agent</string>
              <string name="service_description">Voice-Controlled AI Voice Agent Service.</string>
          </resources>
          EOF

          # 6. res/xml/accessibility_service_config.xml
          cat << 'EOF' > AI_Assistant/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/service_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true" />
          EOF

          # 7. res/layout/activity_main.xml
          cat << 'EOF' > AI_Assistant/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center">
              
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🎙️ Voice Core Agent"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="16dp"/>

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Status: Ready to listen..."
                  android:textSize="14sp"
                  android:textColor="#555555"
                  android:layout_marginBottom="24dp"/>
                  
              <Button
                  android:id="@+id/btnMic"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="🎤 SPEAK COMMAND"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:backgroundTint="#6200EE"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="16dp"/>

              <Button
                  android:id="@+id/btnEnableService"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="⚙️ Enable Agent Permission" 
                  android:layout_marginBottom="24dp"/>
                  
              <View
                  android:layout_width="match_parent"
                  android:layout_height="1dp"
                  android:background="#CCCCCC"
                  android:layout_marginBottom="16dp"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Or Type Command Manually:"
                  android:textSize="12sp"
                  android:layout_marginBottom="8dp"/>

              <EditText
                  android:id="@+id/etCommand"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="e.g. open whatsapp, scroll, home"/>
                  
              <Button
                  android:id="@+id/btnExecute"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Execute Written Command"
                  android:layout_marginTop="8dp"/>
          </LinearLayout>
          EOF

          # 8. AndroidManifest.xml
          cat << 'EOF' > AI_Assistant/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <activity 
                      android:name="com.akash.coreagent.MainActivity" 
                      android:exported="true"
                      android:enabled="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name="com.akash.coreagent.CoreService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # 9. CoreService.java
          cat << 'EOF' > AI_Assistant/app/src/main/java/com/akash/coreagent/CoreService.java
          package com.akash.coreagent;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Path;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.Toast;
          import java.util.List;

          public class CoreService extends AccessibilityService {
              
              public static CoreService instance;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  Toast.makeText(this, "Voice Agent Active!", Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              public void processCommand(String command) {
                  if (command == null || command.trim().isEmpty()) return;
                  String cmd = command.toLowerCase().trim();

                  Toast.makeText(this, "Recognized: " + cmd, Toast.LENGTH_SHORT).show();

                  // 1. Navigation / System Actions (English & Hindi)
                  if (cmd.contains("home")) {
                      performGlobalAction(GLOBAL_ACTION_HOME);
                      return;
                  } else if (cmd.contains("back") || cmd.contains("peeche")) {
                      performGlobalAction(GLOBAL_ACTION_BACK);
                      return;
                  } else if (cmd.contains("recent")) {
                      performGlobalAction(GLOBAL_ACTION_RECENTS);
                      return;
                  } else if (cmd.contains("scroll down") || cmd.contains("scroll") || cmd.contains("niche")) {
                      performScrollDown();
                      return;
                  } else if (cmd.contains("scroll up") || cmd.contains("upar")) {
                      performScrollUp();
                      return;
                  }

                  // 2. Direct App Launchers
                  if (cmd.contains("whatsapp")) {
                      openAppByPackage("com.whatsapp");
                  } else if (cmd.contains("instagram") || cmd.contains("insta")) {
                      openAppByPackage("com.instagram.android");
                  } else if (cmd.contains("youtube")) {
                      openAppByPackage("com.google.android.youtube");
                  } else if (cmd.contains("chrome") || cmd.contains("browser")) {
                      openAppByPackage("com.android.chrome");
                  } else if (cmd.contains("facebook") || cmd.contains("fb")) {
                      openAppByPackage("com.facebook.katana");
                  } else if (cmd.contains("play store") || cmd.contains("playstore")) {
                      openAppByPackage("com.android.vending");
                  } else if (cmd.contains("settings")) {
                      openAppByPackage("com.android.settings");
                  } else {
                      // Generic app search
                      String appName = cmd.replace("open", "")
                                          .replace("kholo", "")
                                          .replace("chalao", "")
                                          .replace("karro", "").trim();
                      openAppByName(appName);
                  }

                  // Auto scroll if command includes scroll along with opening app
                  if (cmd.contains("scroll")) {
                      new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              performScrollDown();
                          }
                      }, 3000);
                  }
              }

              private void openAppByPackage(String packageName) {
                  try {
                      Intent intent = getPackageManager().getLaunchIntentForPackage(packageName);
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } else {
                          Toast.makeText(this, "App not installed: " + packageName, Toast.LENGTH_SHORT).show();
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "Failed to open app", Toast.LENGTH_SHORT).show();
                  }
              }

              private void openAppByName(String appName) {
                  PackageManager pm = getPackageManager();
                  Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                  mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> pkgAppsList = pm.queryIntentActivities(mainIntent, 0);

                  for (ResolveInfo info : pkgAppsList) {
                      String label = info.loadLabel(pm).toString().toLowerCase();
                      if (label.contains(appName)) {
                          Intent launchIntent = pm.getLaunchIntentForPackage(info.activityInfo.packageName);
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(launchIntent);
                              return;
                          }
                      }
                  }
                  Toast.makeText(this, "App not found: " + appName, Toast.LENGTH_SHORT).show();
              }

              private void performScrollDown() {
                  Path swipePath = new Path();
                  swipePath.moveTo(500, 1500);
                  swipePath.lineTo(500, 300);
                  
                  GestureDescription.Builder gestureBuilder = new GestureDescription.Builder();
                  gestureBuilder.addStroke(new GestureDescription.StrokeDescription(swipePath, 0, 500));
                  dispatchGesture(gestureBuilder.build(), null, null);
              }

              private void performScrollUp() {
                  Path swipePath = new Path();
                  swipePath.moveTo(500, 300);
                  swipePath.lineTo(500, 1500);
                  
                  GestureDescription.Builder gestureBuilder = new GestureDescription.Builder();
                  gestureBuilder.addStroke(new GestureDescription.StrokeDescription(swipePath, 0, 500));
                  dispatchGesture(gestureBuilder.build(), null, null);
              }
          }
          EOF

          # 10. MainActivity.java
          cat << 'EOF' > AI_Assistant/app/src/main/java/com/akash/coreagent/MainActivity.java
          package com.akash.coreagent;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.ArrayList;

          public class MainActivity extends AppCompatActivity {

              private static final int PERMISSION_REQUEST_RECORD_AUDIO = 101;
              private SpeechRecognizer speechRecognizer;
              private TextView tvStatus;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button btnEnable = findViewById(R.id.btnEnableService);
                  Button btnExecute = findViewById(R.id.btnExecute);
                  Button btnMic = findViewById(R.id.btnMic);
                  EditText etCommand = findViewById(R.id.etCommand);
                  tvStatus = findViewById(R.id.tvStatus);

                  // Check Mic Permission
                  checkAudioPermission();

                  // Initialize Speech Recognizer
                  setupSpeechRecognizer();

                  btnMic.setOnClickListener(v -> {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                          startListening();
                      } else {
                          checkAudioPermission();
                      }
                  });

                  btnEnable.setOnClickListener(v -> {
                      Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      startActivity(intent);
                      Toast.makeText(this, "Enable 'Core Agent' in accessibility settings", Toast.LENGTH_LONG).show();
                  });

                  btnExecute.setOnClickListener(v -> {
                      String cmd = etCommand.getText().toString();
                      executeCommand(cmd);
                  });
              }

              private void setupSpeechRecognizer() {
                  if (SpeechRecognizer.isRecognitionAvailable(this)) {
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      speechRecognizer.setRecognitionListener(new RecognitionListener() {
                          @Override
                          public void onReadyForSpeech(Bundle params) {
                              tvStatus.setText("Status: 🎙️ Listening... Speak now!");
                          }

                          @Override
                          public void onBeginningOfSpeech() {}

                          @Override
                          public void onRmsChanged(float rmsdB) {}

                          @Override
                          public void onBufferReceived(byte[] buffer) {}

                          @Override
                          public void onEndOfSpeech() {
                              tvStatus.setText("Status: Processing voice...");
                          }

                          @Override
                          public void onError(int error) {
                              tvStatus.setText("Status: Error listening. Try again.");
                          }

                          @Override
                          public void onResults(Bundle results) {
                              ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) {
                                  String spokenText = matches.get(0);
                                  tvStatus.setText("Heard: \"" + spokenText + "\"");
                                  executeCommand(spokenText);
                              }
                          }

                          @Override
                          public void onPartialResults(Bundle partialResults) {}

                          @Override
                          public void onEvent(int eventType, Bundle params) {}
                      });
                  } else {
                      tvStatus.setText("Status: Speech recognition not available on this device.");
                  }
              }

              private void startListening() {
                  if (speechRecognizer != null) {
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_PROMPT, "Speak a command...");
                      speechRecognizer.startListening(intent);
                  }
              }

              private void executeCommand(String cmd) {
                  if (CoreService.instance != null) {
                      CoreService.instance.processCommand(cmd);
                  } else {
                      Toast.makeText(this, "Please Enable Agent Permission First!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void checkAudioPermission() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, PERMISSION_REQUEST_RECORD_AUDIO);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQUEST_RECORD_AUDIO) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          Toast.makeText(this, "Microphone Permission Granted", Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "Microphone Permission Denied!", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (speechRecognizer != null) {
                      speechRecognizer.destroy();
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd AI_Assistant
          gradle assembleDebug --stacktrace

      - name: Upload Core Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: Core-Agent-APK
          path: AI_Assistant/app/build/outputs/apk/debug/app-debug.apk
