name: Build Simple Accessibility Agent APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Native Android Project Structure
        run: |
          mkdir -p AI_Assistant/app/src/main/java/com/akash/coreagent
          mkdir -p AI_Assistant/app/src/main/res/values
          mkdir -p AI_Assistant/app/src/main/res/layout
          mkdir -p AI_Assistant/app/src/main/res/xml
          mkdir -p AI_Assistant/gradle/wrapper

          # 1. settings.gradle
          cat << 'EOF' > AI_Assistant/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "CoreAgent"
          include ':app'
          EOF

          # 2. Project build.gradle
          cat << 'EOF' > AI_Assistant/build.gradle
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }
          EOF

          # 3. App build.gradle
          cat << 'EOF' > AI_Assistant/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.akash.coreagent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.akash.coreagent"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # 4. res/values/strings.xml
          cat << 'EOF' > AI_Assistant/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Core Agent</string>
              <string name="service_description">Ye service phone control (tap, scroll, open apps) karne ke liye hai.</string>
          </resources>
          EOF

          # 5. res/xml/accessibility_service_config.xml
          cat << 'EOF' > AI_Assistant/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/service_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true" />
          EOF

          # 6. res/layout/activity_main.xml
          cat << 'EOF' > AI_Assistant/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="20dp"
              android:gravity="center">
              
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Core Agent Engine"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="20dp"/>
                  
              <Button
                  android:id="@+id/btnEnableService"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="1. Enable Screen Control" />
                  
              <EditText
                  android:id="@+id/etCommand"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Type: 'Open YouTube and scroll'"
                  android:layout_marginTop="20dp"/>
                  
              <Button
                  android:id="@+id/btnExecute"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="2. Execute Command"
                  android:layout_marginTop="10dp"/>
          </LinearLayout>
          EOF

          # 7. AndroidManifest.xml
          cat << 'EOF' > AI_Assistant/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.akash.coreagent">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name=".CoreService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # 8. CoreService.java
          cat << 'EOF' > AI_Assistant/app/src/main/java/com/akash/coreagent/CoreService.java
          package com.akash.coreagent;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Path;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.Toast;

          public class CoreService extends AccessibilityService {
              
              public static CoreService instance;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  Toast.makeText(this, "Agent Service Active!", Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              public void processCommand(String command) {
                  command = command.toLowerCase();
                  
                  if (command.contains("youtube")) {
                      openApp("com.google.android.youtube");
                      
                      if(command.contains("scroll")) {
                          new Handler(Looper.getMainLooper()).postDelayed(this::performScroll, 3000);
                      }
                  } else if (command.contains("scroll")) {
                      performScroll();
                  } else {
                      Toast.makeText(this, "Command not recognized. Try 'Open YouTube and scroll'", Toast.LENGTH_SHORT).show();
                  }
              }

              private void openApp(String packageName) {
                  try {
                      Intent intent = getPackageManager().getLaunchIntentForPackage(packageName);
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "App not found!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void performScroll() {
                  Path swipePath = new Path();
                  swipePath.moveTo(500, 1500);
                  swipePath.lineTo(500, 300);
                  
                  GestureDescription.Builder gestureBuilder = new GestureDescription.Builder();
                  gestureBuilder.addStroke(new GestureDescription.StrokeDescription(swipePath, 0, 500));
                  dispatchGesture(gestureBuilder.build(), null, null);
              }
          }
          EOF

          # 9. MainActivity.java
          cat << 'EOF' > AI_Assistant/app/src/main/java/com/akash/coreagent/MainActivity.java
          package com.akash.coreagent;

          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button btnEnable = findViewById(R.id.btnEnableService);
                  Button btnExecute = findViewById(R.id.btnExecute);
                  EditText etCommand = findViewById(R.id.etCommand);

                  btnEnable.setOnClickListener(v -> {
                      Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      startActivity(intent);
                      Toast.makeText(this, "Please enable 'Core Agent' in settings", Toast.LENGTH_LONG).show();
                  });

                  btnExecute.setOnClickListener(v -> {
                      String cmd = etCommand.getText().toString();
                      if (CoreService.instance != null) {
                          CoreService.instance.processCommand(cmd);
                      } else {
                          Toast.makeText(this, "Please Enable Service First!", Toast.LENGTH_SHORT).show();
                      }
                  });
              }
          }
          EOF

      - name: Setup Gradle Wrapper & Build APK
        run: |
          cd AI_Assistant
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Core Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: Core-Agent-APK
          path: AI_Assistant/app/build/outputs/apk/debug/app-debug.apk
