name: Build Floating Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Create Project Structure
        run: |
          mkdir -p AI_Assistant/app/src/main/java/com/akash/coreagent
          mkdir -p AI_Assistant/app/src/main/res/values
          mkdir -p AI_Assistant/app/src/main/res/layout
          mkdir -p AI_Assistant/app/src/main/res/xml

          echo "sdk.dir=$ANDROID_HOME" > AI_Assistant/local.properties
          
          cat << 'EOF' > AI_Assistant/gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          cat << 'EOF' > AI_Assistant/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CoreAgent"
          include ':app'
          EOF

          cat << 'EOF' > AI_Assistant/build.gradle
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF

          cat << 'EOF' > AI_Assistant/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.akash.coreagent'
              compileSdk 34
              defaultConfig {
                  applicationId "com.akash.coreagent"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          cat << 'EOF' > AI_Assistant/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Core Agent</string>
              <string name="service_description">Voice Agent with Floating Overlay.</string>
          </resources>
          EOF

          cat << 'EOF' > AI_Assistant/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/service_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true" />
          EOF

          cat << 'EOF' > AI_Assistant/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center">
              
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🎙️ Floating Voice Agent"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="24dp"/>

              <Button
                  android:id="@+id/btnEnableAcc"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="1. Enable Accessibility" 
                  android:layout_marginBottom="12dp"/>

              <Button
                  android:id="@+id/btnEnableOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="2. Allow Display Over Apps" 
                  android:layout_marginBottom="12dp"/>

              <Button
                  android:id="@+id/btnStartOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="3. START FLOATING WIDGET"
                  android:backgroundTint="#008000"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold"
                  android:layout_marginBottom="24dp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > AI_Assistant/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <activity android:name="com.akash.coreagent.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name="com.akash.coreagent.CoreService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name="com.akash.coreagent.FloatingWidgetService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > AI_Assistant/app/src/main/java/com/akash/coreagent/CoreService.java
          package com.akash.coreagent;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.Toast;
          import java.util.List;

          public class CoreService extends AccessibilityService {
              public static CoreService instance;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}
              @Override
              public void onInterrupt() {}

              public void processCommand(String command) {
                  if (command == null || command.trim().isEmpty()) return;
                  String cmd = command.toLowerCase().trim();

                  if (cmd.contains("home")) {
                      performGlobalAction(GLOBAL_ACTION_HOME);
                  } else if (cmd.contains("back") || cmd.contains("peeche")) {
                      performGlobalAction(GLOBAL_ACTION_BACK);
                  } else if (cmd.contains("scroll down") || cmd.contains("scroll") || cmd.contains("niche") || cmd.contains("next")) {
                      performScrollDown();
                  } else if (cmd.contains("scroll up") || cmd.contains("upar") || cmd.contains("previous")) {
                      performScrollUp();
                  } else if (cmd.contains("youtube")) {
                      openAppByPackage("com.google.android.youtube");
                  } else if (cmd.contains("whatsapp")) {
                      openAppByPackage("com.whatsapp");
                  } else if (cmd.contains("instagram") || cmd.contains("insta")) {
                      openAppByPackage("com.instagram.android");
                  } else {
                      String appName = cmd.replace("open", "").replace("kholo", "").trim();
                      openAppByName(appName);
                  }
              }

              private void openAppByPackage(String packageName) {
                  try {
                      Intent intent = getPackageManager().getLaunchIntentForPackage(packageName);
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      }
                  } catch (Exception e) {}
              }

              private void openAppByName(String appName) {
                  if(appName.isEmpty()) return;
                  PackageManager pm = getPackageManager();
                  Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                  mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> pkgAppsList = pm.queryIntentActivities(mainIntent, 0);

                  for (ResolveInfo info : pkgAppsList) {
                      String label = info.loadLabel(pm).toString().toLowerCase();
                      if (label.contains(appName)) {
                          Intent launchIntent = pm.getLaunchIntentForPackage(info.activityInfo.packageName);
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(launchIntent);
                              return;
                          }
                      }
                  }
                  Toast.makeText(this, "App not found", Toast.LENGTH_SHORT).show();
              }

              private void performScrollDown() {
                  int width = android.content.res.Resources.getSystem().getDisplayMetrics().widthPixels;
                  int height = android.content.res.Resources.getSystem().getDisplayMetrics().heightPixels;
                  Path swipePath = new Path();
                  swipePath.moveTo(width / 2, (int)(height * 0.8));
                  swipePath.lineTo(width / 2, (int)(height * 0.2));
                  GestureDescription.Builder gestureBuilder = new GestureDescription.Builder();
                  gestureBuilder.addStroke(new GestureDescription.StrokeDescription(swipePath, 0, 150));
                  dispatchGesture(gestureBuilder.build(), null, null);
              }

              private void performScrollUp() {
                  int width = android.content.res.Resources.getSystem().getDisplayMetrics().widthPixels;
                  int height = android.content.res.Resources.getSystem().getDisplayMetrics().heightPixels;
                  Path swipePath = new Path();
                  swipePath.moveTo(width / 2, (int)(height * 0.2));
                  swipePath.lineTo(width / 2, (int)(height * 0.8));
                  GestureDescription.Builder gestureBuilder = new GestureDescription.Builder();
                  gestureBuilder.addStroke(new GestureDescription.StrokeDescription(swipePath, 0, 150));
                  dispatchGesture(gestureBuilder.build(), null, null);
              }
          }
          EOF

          cat << 'EOF' > AI_Assistant/app/src/main/java/com/akash/coreagent/FloatingWidgetService.java
          package com.akash.coreagent;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.Toast;
          import java.util.ArrayList;

          public class FloatingWidgetService extends Service {
              private WindowManager windowManager;
              private Button floatingButton;
              private SpeechRecognizer speechRecognizer;

              @Override
              public void onCreate() {
                  super.onCreate();
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  
                  floatingButton = new Button(this);
                  floatingButton.setText("🎙️");
                  floatingButton.setBackgroundColor(Color.parseColor("#99000000"));
                  floatingButton.setTextColor(Color.WHITE);
                  floatingButton.setTextSize(24);

                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          150, 150,
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? 
                                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : 
                                  WindowManager.LayoutParams.TYPE_PHONE,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT);
                  
                  params.gravity = Gravity.CENTER_VERTICAL | Gravity.END;
                  params.x = 0;
                  params.y = 100;

                  windowManager.addView(floatingButton, params);

                  setupSpeechRecognizer();

                  floatingButton.setOnClickListener(v -> {
                      floatingButton.setText("🔴"); // Shows it's listening
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      speechRecognizer.startListening(intent);
                  });
              }

              private void setupSpeechRecognizer() {
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  speechRecognizer.setRecognitionListener(new RecognitionListener() {
                      @Override
                      public void onReadyForSpeech(Bundle params) {}
                      @Override
                      public void onBeginningOfSpeech() {}
                      @Override
                      public void onRmsChanged(float rmsdB) {}
                      @Override
                      public void onBufferReceived(byte[] buffer) {}
                      @Override
                      public void onEndOfSpeech() {
                          floatingButton.setText("🎙️");
                      }
                      @Override
                      public void onError(int error) {
                          floatingButton.setText("🎙️");
                      }
                      @Override
                      public void onResults(Bundle results) {
                          floatingButton.setText("🎙️");
                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && !matches.isEmpty()) {
                              String command = matches.get(0);
                              Toast.makeText(FloatingWidgetService.this, "Command: " + command, Toast.LENGTH_SHORT).show();
                              if (CoreService.instance != null) {
                                  CoreService.instance.processCommand(command);
                              } else {
                                  Toast.makeText(FloatingWidgetService.this, "Enable Accessibility First!", Toast.LENGTH_SHORT).show();
                              }
                          }
                      }
                      @Override
                      public void onPartialResults(Bundle partialResults) {}
                      @Override
                      public void onEvent(int eventType, Bundle params) {}
                  });
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (floatingButton != null) windowManager.removeView(floatingButton);
                  if (speechRecognizer != null) speechRecognizer.destroy();
              }
          }
          EOF

          cat << 'EOF' > AI_Assistant/app/src/main/java/com/akash/coreagent/MainActivity.java
          package com.akash.coreagent;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 100);
                  }

                  findViewById(R.id.btnEnableAcc).setOnClickListener(v -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  });

                  findViewById(R.id.btnEnableOverlay).setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      } else {
                          Toast.makeText(this, "Overlay Permission already granted!", Toast.LENGTH_SHORT).show();
                      }
                  });

                  findViewById(R.id.btnStartOverlay).setOnClickListener(v -> {
                      if (Settings.canDrawOverlays(this)) {
                          startService(new Intent(this, FloatingWidgetService.class));
                          finish(); // Hide main app
                      } else {
                          Toast.makeText(this, "Please allow Display Over Apps first!", Toast.LENGTH_LONG).show();
                      }
                  });
              }
          }
          EOF

      - name: Build APK
        run: |
          cd AI_Assistant
          gradle assembleDebug --stacktrace

      - name: Upload Core Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: Core-Agent-APK
          path: AI_Assistant/app/build/outputs/apk/debug/app-debug.apk
